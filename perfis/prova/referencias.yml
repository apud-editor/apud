# Referências do documento de prova.
#
# As obras são fictícias, criadas só para testar as regras dos perfis. A única
# real é a Lei nº 10.216, de 2001. Cada obra existe para exercitar uma regra;
# o comentário acima dela diz qual.
#
# O formato é o que o Typst lê (chamado hayagriva), com quatro campos a mais
# que o Apud transforma antes de gerar o PDF, conforme a norma:
#   subtitle         subtítulo (na ABNT, fica sem destaque)
#   uncertain-date   data incerta, já escrita: [2019?], [201-], [201-?]
#   e-number         número eletrônico de artigo sem página
#   parent.location  cidade da revista
#   degree           grau da tese ou dissertação: "Doutorado em Psicologia"
#   event            evento de um trabalho em anais: nome, número, ano e cidade
#   handle           perfil na rede social: "@perfil"
#
# Prenomes que terminam em partícula ("Freitas, Lucas Moreira de") ficam com a
# partícula no fim também nas iniciais da APA: Freitas, L. M. de.

