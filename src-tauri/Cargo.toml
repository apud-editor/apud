[package]
name = "apud"
version = "0.0.1"
description = "Editor de texto acadêmico com normas ABNT e APA"
edition = "2021"

[lib]
name = "apud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Leitura e gravação segura dos arquivos .apud (pasta arquivos/, com testes próprios).
apud-arquivos = { path = "arquivos" }
# Janela "Salvar como" do Windows, para exportar o PDF.
tauri-plugin-dialog = "2"
