# Confere os perfis de norma e roda os testes a cada mudança.
# Roda em todo pull request e em todo envio de branch. O resultado aparece
# como um sinal verde (passou) ou vermelho (falhou) no PR.
name: Testes

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 1. Os perfis em perfis/ estão escritos certo? Mostra os erros em português.
      - name: Conferir os perfis
        run: npm run conferir-perfis

      # 2. Testes do código, inclusive a cobertura do checklist.
      - name: Testes
        run: npm test

      # 3. Gravação dos arquivos .apud (módulo em Rust, sem precisar do Windows).
      - name: Testes da gravação dos arquivos
        run: cargo test --manifest-path src-tauri/arquivos/Cargo.toml

      # 4. Documento de prova: compara com os gabaritos e gera os PDFs.
      - name: Documento de prova
        run: npm run prova

      # 5. Texto de exemplo em ABNT, para conferir a paginação (margens, títulos, alíneas).
      - name: PDF de exemplo
        run: npm run exemplo-pdf

      # Os PDFs ficam disponíveis para baixar na página desta execução, em "Artifacts".
      - name: Guardar os PDFs do documento de prova
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documento-de-prova
          path: |
            perfis/prova/saida/*.pdf
            perfis/prova/saida/*.apud
          if-no-files-found: ignore
