# Monta o instalador do Apud para Windows.
# - Em cada pull request: o instalador fica para baixar na página da execução,
#   em "Artifacts", para testar ANTES de juntar a mudança ao projeto.
# - Em cada envio para a branch main: publica na aba "Releases" do GitHub.
# Também dá para rodar manualmente pela aba Actions.
name: Instalador Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Necessário para criar a página de download (release) com o instalador.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Guarda o que o Rust já compilou, para as próximas montagens serem mais rápidas.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Pull request: só monta o instalador, sem publicar.
      - name: Montar o instalador (teste do PR)
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v0

      - name: Guardar o instalador para baixar
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: instalador-apud-pr-${{ github.event.pull_request.number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Branch main: monta e publica na aba Releases.
      - name: Montar e publicar o instalador
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: teste-${{ github.run_number }}
          releaseName: "Apud (teste ${{ github.run_number }})"
          releaseBody: "Instalador de teste para Windows. Baixe o arquivo .exe abaixo."
          releaseDraft: false
          prerelease: true
